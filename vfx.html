<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROMANO — VFX // Сейчас не доступно</title>
<link rel="icon" href="favicon-vfx.svg" type="image/svg+xml">
<link rel="icon" href="favicon-vfx-32.png" sizes="32x32" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700;800;900&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:        #0b0b0d;
    --fg:        #edede8;
    --fg-dim:    #8d8d94;
    --accent:    #ff3d1f;
    --line-strong: rgba(237,237,232,.28);

    --f-display: 'Unbounded', sans-serif;
    --f-body:    'Manrope', sans-serif;
    --f-mono:    'JetBrains Mono', monospace;

    /* доп. размытие поверх уже мягкого рендера; 0px — без него */
    --blur: 0px;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }
  html, body{ height:100%; }
  body{
    background:var(--bg);
    color:var(--fg);
    font-family:var(--f-body);
    overflow:hidden;
  }
  ::selection{ background:var(--accent); color:#0b0b0d; }
  a{ color:inherit; text-decoration:none; }

  /* ================= ФОН ================= */
  .bg{ position:fixed; inset:0; z-index:0; overflow:hidden; background:var(--bg); }

  /* запасной огонь на CSS: виден, пока видео не загрузилось (или если файла ещё нет) */
  .fire-fallback{ position:absolute; inset:0; transition:opacity 1.4s ease; }
  .fire-fallback::before{
    content:''; position:absolute; inset:-10%;
    background:
      radial-gradient(ellipse 28% 42% at 50% 52%, rgba(255,150,40,.55), transparent 70%),
      radial-gradient(ellipse 14% 62% at 50% 50%, rgba(255,70,20,.55), transparent 72%),
      radial-gradient(ellipse 52% 26% at 50% 40%, rgba(255,61,31,.38), transparent 72%);
    filter:blur(40px);
    animation: flameBreath 2.6s ease-in-out infinite alternate;
  }
  @keyframes flameBreath{
    0%  { opacity:.55; transform:scale(.96) translateY(1%); }
    35% { opacity:.95; transform:scale(1.04) translateY(-1%); }
    60% { opacity:.7;  transform:scale(.99) translateY(.5%); }
    100%{ opacity:1;   transform:scale(1.06) translateY(-1.5%); }
  }

  .bg.has-video .fire-fallback{ opacity:0; }

  .bg video{
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover;
    /* чёрный фон ролика становится прозрачным — остаётся только огонь */
    mix-blend-mode: screen;
    /* scale прячет светлую кайму, которую blur рисует по краям кадра */
    filter: blur(var(--blur));
    transform: scale(1.12);
    opacity:0;
    transition: opacity 1.4s ease;
  }
  .bg video.ready{ opacity:.82; }

  /* виньетка + затемнение под текст */
  .bg::after{
    content:''; position:absolute; inset:0; pointer-events:none;
    background:
      radial-gradient(ellipse at center, rgba(11,11,13,.15) 0%, rgba(11,11,13,.72) 100%),
      linear-gradient(to bottom, rgba(11,11,13,.55), transparent 22%, transparent 70%, rgba(11,11,13,.7));
  }

  /* лёгкое зерно плёнки */
  .grain{
    position:fixed; inset:-50%; z-index:1; pointer-events:none; opacity:.07;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    animation: grain 1s steps(6) infinite;
  }
  @keyframes grain{
    0%{ transform:translate(0,0); } 20%{ transform:translate(-3%,2%); }
    40%{ transform:translate(2%,-3%); } 60%{ transform:translate(-2%,-1%); }
    80%{ transform:translate(3%,3%); } 100%{ transform:translate(0,0); }
  }

  /* ================= ВИДОИСКАТЕЛЬ ================= */
  .vf{ position:fixed; inset:22px; z-index:3; pointer-events:none; }
  .vf i{ position:absolute; width:26px; height:26px; border:2px solid var(--accent); }
  .vf i:nth-child(1){ top:0; left:0;  border-right:0; border-bottom:0; }
  .vf i:nth-child(2){ top:0; right:0; border-left:0;  border-bottom:0; }
  .vf i:nth-child(3){ bottom:0; left:0;  border-right:0; border-top:0; }
  .vf i:nth-child(4){ bottom:0; right:0; border-left:0;  border-top:0; }

  .rec{
    position:fixed; z-index:3; left:50px; bottom:44px;
    display:flex; align-items:center; gap:10px;
    font-family:var(--f-mono); font-size:11px; letter-spacing:.14em; color:var(--fg-dim);
  }
  .rec b{
    width:9px; height:9px; border-radius:50%; background:var(--accent);
    box-shadow:0 0 10px var(--accent);
    animation: blink 1.2s steps(2, jump-none) infinite;
  }
  @keyframes blink{ 0%{ opacity:1; } 100%{ opacity:.15; } }
  .tc{
    position:fixed; z-index:3; right:50px; bottom:44px;
    font-family:var(--f-mono); font-size:11px; letter-spacing:.14em; color:var(--fg-dim);
    font-variant-numeric: tabular-nums;
  }

  /* ================= ШАПКА ================= */
  header{
    position:fixed; top:0; left:0; right:0; z-index:5;
    padding:40px 56px;
    display:flex; align-items:center; gap:26px;
  }
  .logo{
    font-family:var(--f-display); font-weight:800; font-size:15px;
    letter-spacing:.04em;
  }
  .logo span{ color:var(--accent); }
  .switcher{
    display:flex; border:1px solid var(--line-strong);
    font-family:var(--f-mono); font-size:11px; letter-spacing:.08em;
    backdrop-filter: blur(6px);
    background:rgba(11,11,13,.35);
  }
  .sw-item{ padding:8px 16px; color:var(--fg-dim); transition:.25s; }
  .sw-item.active{ background:var(--accent); color:#08080a; }
  .sw-item:not(.active):hover{ color:var(--fg); }

  /* ================= КОНТЕНТ ================= */
  main{
    position:relative; z-index:2; height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:0 24px;
  }
  .eyebrow{
    font-family:var(--f-mono); font-size:12px; letter-spacing:.2em; text-transform:uppercase;
    color:var(--accent);
    display:flex; align-items:center; gap:12px;
  }
  .eyebrow::before, .eyebrow::after{ content:''; width:26px; height:1px; background:var(--accent); }

  h1{
    margin-top:22px;
    font-family:var(--f-display); font-weight:900; text-transform:uppercase;
    font-size:clamp(34px, 7.4vw, 108px);
    line-height:.98; letter-spacing:-.01em;
    text-shadow:0 0 60px rgba(255,61,31,.35);
  }
  h1 em{
    font-style:normal; display:block;
    -webkit-text-stroke:2px var(--fg); color:rgba(11,11,13,.45);
    text-shadow:none;
  }

  .note{
    margin-top:28px; max-width:440px;
    font-family:var(--f-mono); font-size:13px; line-height:1.7; color:#c9c9cf;
    letter-spacing:.03em;
    text-shadow:0 0 14px var(--bg), 0 0 4px var(--bg);
  }

  .cta{
    margin-top:34px;
    display:inline-flex; align-items:center; gap:12px;
    padding:14px 26px;
    font-family:var(--f-mono); font-size:12px; letter-spacing:.12em; text-transform:uppercase;
    border:1px solid var(--line-strong);
    background:rgba(11,11,13,.4); backdrop-filter:blur(6px);
    clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px);
    transition: background .25s, color .25s, border-color .25s;
  }
  .cta:hover{ background:var(--accent); color:#08080a; border-color:var(--accent); }
  .cta span{ transition:transform .25s; }
  .cta:hover span{ transform:translateX(4px); }

  @media (max-width:700px){
    header{ padding:36px 40px; gap:16px; }
    .rec{ left:40px; bottom:38px; }
    .tc{ right:40px; bottom:38px; }
    .vf{ inset:14px; }
    :root{ --blur: 4px; }
    /* на вертикальном экране cover раздувает крест до размера экрана — вписываем целиком,
       чёрные поля невидимы благодаря screen-blend */
    .bg video{ object-fit:contain; transform:scale(2.1); }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>

<!-- Фон: запасной CSS-огонь → поверх плавно проявляется видео -->
<div class="bg" aria-hidden="true">
  <div class="fire-fallback"></div>
  <!-- положи файлы рядом с этим html: video/burning-cross.webm, video/burning-cross.mp4, video/burning-cross-poster.jpg -->
  <video id="bgVideo" autoplay muted loop playsinline preload="auto" poster="video/burning-cross-poster.jpg">
    <source src="video/burning-cross.webm" type="video/webm">
    <source src="video/burning-cross.mp4" type="video/mp4">
  </video>
</div>
<div class="grain" aria-hidden="true"></div>

<div class="vf" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<div class="rec" aria-hidden="true"><b></b>STANDBY</div>
<div class="tc" id="tc" aria-hidden="true">00:00:00:00</div>

<header>
  <div class="logo">ROMANO<span>.</span>VFX</div>
  <div class="switcher">
    <a href="vfx.html" class="sw-item active">VFX</a>
    <a href="index.html" class="sw-item">BIM</a>
  </div>
</header>

<main>
  <div class="eyebrow">VFX PORTFOLIO</div>
  <h1><em>Сейчас</em>не доступно</h1>
  <p class="note">Портфолио в разработке — скоро здесь появится новый шоурил.</p>
  <a class="cta" href="index.html">Смотреть BIM-портфолио <span>→</span></a>
</main>

<script>
  const v = document.getElementById('bgVideo');

  // видео плавно проявляется поверх CSS-огня, как только готово играть
  const reveal = () => { v.classList.add('ready'); v.parentElement.classList.add('has-video'); };
  if (v.readyState >= 3) reveal(); else v.addEventListener('canplay', reveal, { once:true });

  // при «уменьшить движение» — стоп-кадр (постер) вместо зацикленного видео
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    v.removeAttribute('autoplay'); v.pause();
  }

  // таймкод в углу — считает от загрузки страницы, 24 fps
  const tc = document.getElementById('tc'), t0 = performance.now();
  const p2 = n => String(n).padStart(2, '0');
  (function tick(){
    const f = Math.floor((performance.now() - t0) / 1000 * 24);
    const s = Math.floor(f / 24);
    tc.textContent = p2(Math.floor(s / 3600)) + ':' + p2(Math.floor(s / 60) % 60) + ':' + p2(s % 60) + ':' + p2(f % 24);
    requestAnimationFrame(tick);
  })();
</script>

</body>
</html>
